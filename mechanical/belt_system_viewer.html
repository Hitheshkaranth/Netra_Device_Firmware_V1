function decode(b64, lo, span){
  const bin = atob(b64), n = bin.length/2, p = new Float32Array(n);
  for(let i=0;i<n;i++){
    const q = bin.charCodeAt(i*2) | (bin.charCodeAt(i*2+1)<<8);
    p[i] = lo[i%3] + q/65535*span[i%3];
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  g.computeVertexNormals();
  return g;
}

const wrap = document.getElementById('wrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f12);
const camera = new THREE.PerspectiveCamera(30, 1, 1, 6000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
wrap.appendChild(renderer.domElement);

const key  = new THREE.DirectionalLight(0xffffff, 2.0);
const fill = new THREE.DirectionalLight(0x9fb4cc, 0.8);
const rim  = new THREE.DirectionalLight(0xffe3c0, 1.3);
key.position.set(120, 160, 200);
fill.position.set(-200, 40, 120);
rim.position.set(-60, -120, -200);
scene.add(key, fill, rim,
  new THREE.HemisphereLight(0x5b6c7a, 0x14171b, 0.6),
  new THREE.AmbientLight(0xffffff, 0.22));

const GC = {structure:0xff6b17, belt:0x4a3a2e, board:0x27a567,
            sensor:0x4d90d9, power:0xd8a53a, control:0xd4655c};
const GLABEL = {structure:'Enclosure', belt:'Belt', board:'Controller',
                sensor:'Sensing', power:'Power', control:'Controls'};

const root = new THREE.Group(); scene.add(root);
const meshes = {}, shellKeys = [];
for(const it of DATA.items){
  const g = decode(DATA.parts[it.k], DATA.lo, DATA.span);
  const col = GC[it.g] || 0xb9bec4;
  const isStruct = (it.g === 'structure');
  const m = new THREE.MeshStandardMaterial({
    color: col,
    metalness: isStruct ? 0.05 : (it.g==='belt' ? 0.05 : 0.35),
    roughness: isStruct ? 0.48 : (it.g==='belt' ? 0.85 : 0.55),
    transparent: isStruct, opacity: isStruct ? 0.24 : 1.0,
    depthWrite: !isStruct, side: THREE.DoubleSide});
  const mesh = new THREE.Mesh(g, m);
  mesh.renderOrder = isStruct ? 2 : 1;
  mesh.userData = it;
  meshes[it.k] = mesh; root.add(mesh);
  if(isStruct) shellKeys.push(it.k);
}
const box = new THREE.Box3().setFromObject(root);
root.position.sub(box.getCenter(new THREE.Vector3()));
const radius = box.getSize(new THREE.Vector3()).length()/2;

// legend
const list = document.getElementById('list');
const order = ['structure','board','sensor','power','control','belt'];
for(const g of order){
  const items = DATA.items.filter(i=>i.g===g);
  if(!items.length) continue;
  const h = document.createElement('div');
  h.className='grp'; h.textContent = GLABEL[g] || g; list.appendChild(h);
  for(const it of items){
    const row = document.createElement('div');
    row.className = 'it';
    row.innerHTML = '<span class="sw" style="background:#'+
      (GC[it.g]||0xb9bec4).toString(16).padStart(6,'0')+'"></span><span>'+
      it.name+'</span><span class="dim">'+(it.dim||'')+'</span>';
    row.onclick = ()=>{ const m = meshes[it.k]; m.visible = !m.visible;
      row.classList.toggle('off', !m.visible); };
    list.appendChild(row);
  }
}

let yaw=-0.7, pitch=0.38, spin=true, drag=false, px=0, py=0, dist=radius*3.2;
const el = renderer.domElement;
el.addEventListener('pointerdown', e=>{drag=true;px=e.clientX;py=e.clientY;el.setPointerCapture(e.pointerId);});
el.addEventListener('pointerup', ()=>{drag=false;});
el.addEventListener('pointercancel', ()=>{drag=false;});
el.addEventListener('pointermove', e=>{
  if(!drag) return;
  yaw -= (e.clientX-px)*0.008;
  pitch = Math.max(-1.45, Math.min(1.45, pitch-(e.clientY-py)*0.008));
  px=e.clientX; py=e.clientY; spin=false; bSpin.classList.remove('on');
});
el.addEventListener('wheel', e=>{e.preventDefault();
  dist = Math.max(radius*0.4, Math.min(radius*8, dist*(1+Math.sign(e.deltaY)*0.09)));},{passive:false});

const bGhost=document.getElementById('bGhost'), bAll=document.getElementById('bAll'),
      bSpin=document.getElementById('bSpin'), bFit=document.getElementById('bFit'),
      ex=document.getElementById('ex');
let ghost = true;
bGhost.onclick = ()=>{ ghost=!ghost; bGhost.classList.toggle('on',ghost);
  shellKeys.forEach(k=>{ const m=meshes[k].material;
    m.opacity = ghost?0.24:1.0; m.depthWrite = !ghost; }); };
let hidden = false;
bAll.onclick = ()=>{ hidden=!hidden;
  DATA.items.filter(i=>i.g!=='structure'&&i.g!=='belt').forEach(i=>meshes[i.k].visible=!hidden);
  document.querySelectorAll('.it').forEach(r=>{});
  bAll.textContent = hidden ? 'Show all parts' : 'Hide all parts'; };
bSpin.onclick = ()=>{ spin=!spin; bSpin.classList.toggle('on',spin); };
bFit.onclick = ()=>{ dist=radius*3.2; yaw=-0.7; pitch=0.38; };

function resize(){ const w=wrap.clientWidth,h=wrap.clientHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h); }
addEventListener('resize', resize); resize();

(function tick(){
  requestAnimationFrame(tick);
  if(spin) yaw += 0.0030;
  const e = ex.value/100;
  for(const it of DATA.items){
    const m = meshes[it.k];
    m.position.z = (it.ez||0)*e*60;
    m.position.x = (it.exx||0)*e*40;
  }
  camera.position.set(dist*Math.cos(pitch)*Math.sin(yaw), dist*Math.sin(pitch),
                      dist*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
})();
</script>
